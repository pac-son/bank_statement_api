<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lender Portal Demo - Embeddable Widget</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 22px;
      margin-top: 0;
      color: #fff;
    }
    p {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
    }
    .cta-btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      text-align: center;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .cta-btn:hover {
      background: #1d4ed8;
    }
    .result-box {
      margin-top: 24px;
      padding: 16px;
      background: #030712;
      border: 1px solid #1f2937;
      border-radius: 8px;
      display: none;
    }
    pre {
      font-size: 12px;
      color: #38bdf8;
      overflow-x: auto;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:12px; font-weight:700; color:#3b82f6; text-transform:uppercase; letter-spacing:1px;">Partner MFB Loan App</span>
      <span style="font-size:11px; background:#1e293b; padding:4px 8px; border-radius:4px; color:#94a3b8;">Embed Demo</span>
    </div>
    
    <h1 style="margin-top:16px;">Apply for ₦500,000 SME Growth Loan</h1>
    <p>
      To complete your loan appraisal in under 60 seconds, connect your primary commercial or neobank statement below.
    </p>

    <button id="open-widget-btn" class="cta-btn">
      Connect Bank Statement via Widget
    </button>

    <div id="result-box" class="result-box">
      <h4 style="margin:0 0 8px 0; font-size:13px; color:#10b981;">✓ Statement Received Callback</h4>
      <pre id="json-output"></pre>
    </div>
  </div>

  <!-- Include the Embeddable Widget Script -->
  <script src="/widget.js"></script>
  <script>
    const widget = new BankStatementWidget({
      lenderName: "Renmoney / Carbon MFB",
      primaryColor: "#2563eb",
      theme: "dark",
      apiUrl: "http://127.0.0.1:8000",
      onSuccess: function (data) {
        console.log("Widget upload success:", data);
        document.getElementById("result-box").style.display = "block";
        document.getElementById("json-output").innerText = JSON.stringify({
          bank: data.bank,
          risk_level: data.loan_stacking?.risk_level,
          fraud_score: data.fraud_evaluation?.fraud_score,
          recommendation: data.credit_narrative?.recommendation,
          max_loan: data.credit_narrative?.recommended_max_loan_capacity
        }, null, 2);
      },
      onError: function (err) {
        console.error("Widget error:", err);
      }
    });

    document.getElementById("open-widget-btn").onclick = () => {
      widget.open();
    };
  </script>
</body>
</html>
