services:
  # Credova All-in-One Engine (FastAPI + Embedded Underwriting Dashboard + Tesseract OCR)
  - type: web
    name: credova-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8000
    healthCheckPath: /docs
