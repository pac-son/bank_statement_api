services:
  # Credova Backend API with Tesseract OCR (built via Dockerfile)
  - type: web
    name: credova-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8000
    healthCheckPath: /docs

  # Credova Frontend Web Dashboard (Swift Rust / React)
  - type: web
    name: credova-dashboard
    env: node
    rootDir: frontend
    buildCommand: bun install && bun run build
    startCommand: bun run start
    plan: free
    region: frankfurt
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: credova-api
          property: host
