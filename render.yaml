services:
  # ---------------- BACKEND ----------------
  - type: web
    name: credova-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false

  # ---------------- FRONTEND ----------------
  - type: web
    name: credova-frontend  # (Use whatever name you already have here)
    # ... keep your existing env, buildCommand, and startCommand here ...
    envVars:
      - key: NEXT_PUBLIC_PAYSTACK_KEY
        sync: false
      - key: SWIFT_RUST_SITE_URL
        sync: false